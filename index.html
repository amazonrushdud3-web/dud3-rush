<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DUD3 Rush PRO — Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0b111e;
      --card: rgba(19, 29, 49, 0.85);
      --border: rgba(56, 189, 248, 0.22);
      --prime: #00a8e1;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
    }
    .brand { font-weight: 800; font-size: 1.1rem; color: var(--prime); letter-spacing: 0.5px; }
    .status-pill { font-size: 0.75rem; padding: 4px 8px; border-radius: 99px; background: rgba(34,197,94,0.15); color: var(--green); }
    .status-pill.offline { background: rgba(239,68,68,0.2); color: var(--red); }
    .container { max-width: 720px; margin: 0 auto; padding: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: 14px;
      backdrop-filter: blur(12px);
    }
    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
    .tab-btn {
      flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(15,23,42,0.7); color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .tab-btn.active { background: var(--prime); color: #000; border-color: var(--prime); }
    .mode-switch { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn {
      padding: 10px 14px; border-radius: 10px; border: none; font-weight: 700;
      cursor: pointer; transition: 0.15s; background: var(--prime); color: #000;
    }
    .btn.secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--border); }
    .btn.danger { background: var(--red); color: #fff; }
    .btn.success { background: var(--green); color: #000; }
    #reader-wrap { position: relative; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 12px; display: none; }
    #reader { width: 100%; }
    .flash-overlay {
      position: absolute; inset: 0; background: rgba(34, 197, 94, 0.55);
      pointer-events: none; opacity: 0; transition: opacity 0.2s;
    }
    .flash-overlay.active { opacity: 1; }
    .search-wrap { position: relative; }
    .scan-input {
      width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.9); color: var(--text); font-size: 1rem; outline: none;
    }
    .scan-input:focus { border-color: var(--prime); }
    .dropdown {
      position: absolute; top: 100%; left: 0; right: 0; background: #0f172a;
      border: 1px solid var(--prime); border-radius: 10px; margin-top: 4px;
      max-height: 240px; overflow-y: auto; z-index: 40; display: none;
    }
    .dropdown-item {
      padding: 10px 12px; display: flex; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer;
    }
    .dropdown-item.active, .dropdown-item:hover { background: rgba(0, 168, 225, 0.22); }
    .banner {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 28px); max-width: 680px; padding: 14px 16px;
      border-radius: 12px; font-weight: 700; z-index: 100; display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); cursor: pointer;
    }
    .row-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .badge { padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
    .badge.Present { background: rgba(34,197,94,0.2); color: var(--green); }
    .badge.Late { background: rgba(245,158,11,0.2); color: var(--amber); }
    .badge.Absent, .badge.Violator { background: rgba(239,68,68,0.2); color: var(--red); }
    .badge.Break { background: rgba(168,85,247,0.25); color: #c084fc; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px;
    }
    .modal { background: #1e293b; border: 1px solid var(--border); border-radius: 14px; max-width: 420px; width: 100%; padding: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    input.cfg { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: #fff; margin-top: 4px; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="brand">DUD3 RUSH PRO</div>
    <div style="font-size:0.75rem;color:var(--muted)" id="dayLabel">Loading...</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <span id="netStatus" class="status-pill">ONLINE</span>
    <button class="btn secondary" onclick="refreshRoster(true)" style="padding:6px 10px;font-size:0.8rem;">↻ Refresh</button>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('scan', this)">📷 Scan</button>
    <button class="tab-btn" onclick="switchTab('waiting', this)">⏳ Waiting (<span id="waitCount">0</span>)</button>
    <button class="tab-btn" onclick="switchTab('breaks', this)">☕ Breaks</button>
    <button class="tab-btn" onclick="switchTab('violators', this)">⚠️ Violators (<span id="violCount">0</span>)</button>
    <button class="tab-btn" onclick="switchTab('settings', this)">⚙️ Settings</button>
  </div>

  <!-- SCAN TAB -->
  <div id="tab-scan">
    <div class="card">
      <div class="mode-switch">
        <button id="modeCheckIn" class="btn" style="flex:1" onclick="setScanMode('CHECK_IN')">CHECK-IN SCAN</button>
        <button id="modeEntry" class="btn secondary" style="flex:1" onclick="setScanMode('ENTRY')">ENTRY / DISPATCH SCAN</button>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <button class="btn success" style="flex:1" id="camBtn" onclick="startCamera()">📷 Start Camera Scan</button>
        <button class="btn secondary" onclick="stopCamera()" id="stopCamBtn" style="display:none;">Stop</button>
      </div>

      <div id="reader-wrap">
        <div id="reader"></div>
        <div id="camFlash" class="flash-overlay"></div>
      </div>

      <div class="search-wrap">
        <input
          id="scanInput"
          class="scan-input"
          type="text"
          placeholder="Type/paste Employee ID or Name → Enter"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        />
        <div id="fuzzyDropdown" class="dropdown"></div>
      </div>
      <div style="font-size:0.75rem;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;">
        <span>Roster in memory: <strong id="rosterCount">0</strong> DAs</span>
        <span>Offline Queue: <strong id="queueCount">0</strong></span>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h4>Recent Scans</h4>
        <button class="btn secondary" style="padding:4px 8px;font-size:0.75rem;" onclick="exportRosterCSV()">Export CSV</button>
      </div>
      <div id="recentScansList"></div>
    </div>
  </div>

  <!-- WAITING TAB -->
  <div id="tab-waiting" style="display:none;">
    <div class="card">
      <input id="waitSearch" class="scan-input" placeholder="Search waiting DAs by Name or ID..." oninput="displayWaitingList()" style="margin-bottom:12px;padding:10px;" />
      <div id="waitingBatchesContainer"></div>
    </div>
  </div>

  <!-- BREAKS TAB -->
  <div id="tab-breaks" style="display:none;">
    <div class="card">
      <div class="mode-switch">
        <button class="btn secondary" onclick="renderBreaks('upcoming')">Upcoming</button>
        <button class="btn" onclick="renderBreaks('onBreak')">On Break</button>
        <button class="btn secondary" onclick="renderBreaks('completed')">Completed</button>
      </div>
      <div id="breaksList"></div>
    </div>
  </div>

  <!-- VIOLATORS TAB -->
  <div id="tab-violators" style="display:none;">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h4>Pending Entry Violators (&gt;15m)</h4>
        <button class="btn danger" style="padding:6px 10px;font-size:0.8rem;" onclick="clearSelectedViolators()">Clear Selected</button>
      </div>
      <div id="violatorsList"></div>
    </div>
  </div>

  <!-- SETTINGS TAB -->
  <div id="tab-settings" style="display:none;">
    <div class="card">
      <h4 style="margin-bottom:10px;">Scanner Backend API &amp; Monthly Sheet</h4>
      <label style="font-size:0.8rem;color:var(--muted);">Apps Script Deployment #1 (/exec URL)</label>
      <input id="cfgApiUrl" class="cfg" placeholder="https://script.google.com/macros/s/.../exec" />
      <label style="font-size:0.8rem;color:var(--muted);display:block;margin-top:8px;">Link Monthly Google Sheet URL</label>
      <input id="cfgSheetUrl" class="cfg" placeholder="https://docs.google.com/spreadsheets/d/..." />
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn" onclick="saveSheetLink()">Save / Link Sheet</button>
        <button class="btn secondary" onclick="unlinkSheet()">Remove Sheet</button>
      </div>
    </div>

    <div class="card">
      <h4 style="margin-bottom:10px;">Thresholds &amp; Rules</h4>
      <div class="grid-2">
        <div><label style="font-size:0.75rem">Pre-Wave Block (min)</label><input id="cfgPreWave" type="number" class="cfg" value="-30" /></div>
        <div><label style="font-size:0.75rem">Present Window (+min)</label><input id="cfgPresentWin" type="number" class="cfg" value="10" /></div>
        <div><label style="font-size:0.75rem">Entry Timeout (min)</label><input id="cfgEntryTimeout" type="number" class="cfg" value="15" /></div>
        <div><label style="font-size:0.75rem">Manual Break Override</label><input id="cfgBreakOverride" type="checkbox" style="transform:scale(1.3);margin-top:12px;" /></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn" onclick="saveSettingsToServer()">Save Thresholds</button>
        <button class="btn danger" onclick="triggerStartNewDay()">Start New Day (Reset)</button>
      </div>
    </div>
  </div>
</div>

<!-- 2-BUTTON VIOLATOR MODAL -->
<div id="violatorModal" class="modal-backdrop">
  <div class="modal">
    <h3 style="color:var(--red);margin-bottom:8px;">⚠️ Violator Detected</h3>
    <p id="violatorModalText" style="margin-bottom:16px;color:var(--muted);"></p>
    <div class="grid-2">
      <button class="btn success" onclick="resolveViolatorModal('Allow')">Allow Entry</button>
      <button class="btn danger" onclick="resolveViolatorModal('Deny')">No (Remove)</button>
    </div>
  </div>
</div>

<div id="banner" class="banner" onclick="this.style.display='none'"></div>

<script>
  // PUT DEPLOYMENT #1 /exec URL HERE OR IN SETTINGS
  let SCANNER_API_URL = localStorage.getItem('DUD3_API_URL') || 'PASTE_SCANNER_EXEC_URL_HERE';

  let state = {
    scanMode: 'CHECK_IN',
    roster: JSON.parse(localStorage.getItem('DUD3_ROSTER') || '[]'),
    waitingBatches: JSON.parse(localStorage.getItem('DUD3_BATCHES') || '[{"batch":1,"members":[]}]'),
    violators: [],
    scanHistory: [],
    settings: { preWaveBlockMin: -30, presentWindowMin: 10, entryTimeoutMin: 15, manualBreakOverride: false },
    offlineQueue: JSON.parse(localStorage.getItem('DUD3_QUEUE') || '[]')
  };

  let html5QrCode = null;
  let lastScanEpoch = 0;
  let lastScannedId = '';
  let lastSameIdEpoch = 0;
  let fuzzyCandidates = [];
  let activeViolatorId = null;

  /* ==================== SOUND & HAPTICS ==================== */
  function playTone(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      if (type === 'success') { osc.frequency.value = 880; gain.gain.value = 0.15; osc.start(); osc.stop(ctx.currentTime + 0.12); }
      else if (type === 'warn') { osc.frequency.value = 440; gain.gain.value = 0.2; osc.start(); osc.stop(ctx.currentTime + 0.25); }
      else { osc.frequency.value = 220; gain.gain.value = 0.25; osc.start(); osc.stop(ctx.currentTime + 0.35); }
      if (navigator.vibrate) navigator.vibrate(type === 'success' ? 60 : [100, 50, 100]);
    } catch (e) {}
  }

  function showBanner(msg, color = 'var(--green)') {
    const b = document.getElementById('banner');
    b.style.background = color;
    b.style.color = '#000';
    b.textContent = msg;
    b.style.display = 'block';
    clearTimeout(b._t);
    b._t = setTimeout(() => { b.style.display = 'none'; }, 3500);
  }

  /* ==================== CAMERA SCANNING (1 scan per session) ==================== */
  async function startCamera() {
    document.getElementById('reader-wrap').style.display = 'block';
    document.getElementById('stopCamBtn').style.display = 'inline-block';
    document.getElementById('camBtn').textContent = 'Scanning...';
    try {
      if (!html5QrCode) html5QrCode = new Html5Qrcode('reader');
      await html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 15, qrbox: { width: 250, height: 140 } },
        (decodedText) => onCameraDecode(decodedText),
        () => {}
      );
    } catch (err) {
      showBanner('Camera unavailable/denied — switched to fast text mode', 'var(--amber)');
      stopCamera();
      document.getElementById('scanInput').focus();
    }
  }

  async function stopCamera() {
    if (html5QrCode && html5QrCode.isScanning) {
      try { await html5QrCode.stop(); } catch (e) {}
    }
    document.getElementById('reader-wrap').style.display = 'none';
    document.getElementById('stopCamBtn').style.display = 'none';
    document.getElementById('camBtn').textContent = '📷 Start Camera Scan';
  }

  async function onCameraDecode(code) {
    const flash = document.getElementById('camFlash');
    flash.classList.add('active');
    setTimeout(() => flash.classList.remove('active'), 220);
    // Stop camera immediately after 1 successful decode per spec
    await stopCamera();
    handleScanInput(code);
  }

  /* ==================== FUZZY NAME + PHONETIC + LEVENSHTEIN ==================== */
  function soundex(s) {
    const a = s.toLowerCase().replace(/[^a-z]/g, '').split('');
    if (!a.length) return '';
    const f = a.shift();
    const codes = { b:1,f:1,p:1,v:1, c:2,g:2,j:2,k:2,q:2,s:2,x:2,z:2, d:3,t:3, l:4, m:5,n:5, r:6 };
    const r = a.map(c => codes[c] || 0).filter((v, i, arr) => i === 0 ? v !== codes[f] : v !== arr[i - 1]).filter(Boolean);
    return (f + r.join('') + '000').slice(0, 4).toUpperCase();
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (Math.abs(m - n) > 3) return 99;
    const dp = Array.from({ length: m + 1 }, (_, i) => [i]);
    for (let j = 1; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        dp[i][j] = a[i - 1] === b[j - 1]
          ? dp[i - 1][j - 1]
          : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
      }
    }
    return dp[m][n];
  }

  function findSimilarDAs(query) {
    const q = String(query || '').trim().toLowerCase();
    if (!q) return [];
    const qSdx = soundex(q);
    const scored = [];

    for (const da of state.roster) {
      const id = da.id.toLowerCase();
      const name = da.name.toLowerCase();
      const tokens = name.split(/\s+/);
      let score = 0;

      if (id === q) score = 1000;
      else if (name === q) score = 950;
      else if (id.startsWith(q) || id.includes(q)) score = 800;
      else if (name.startsWith(q)) score = 750;
      else if (tokens.some(t => t.startsWith(q))) score = 700;
      else if (name.includes(q)) score = 600;
      else if (qSdx && tokens.some(t => soundex(t) === qSdx)) score = 500;
      else {
        const minDist = Math.min(...tokens.map(t => levenshtein(q, t)));
        if (minDist <= 2) score = 400 - minDist * 50;
      }

      if (score > 0) scored.push({ da, score });
    }
    return scored.sort((a, b) => b.score - a.score).slice(0, 8).map(s => s.da);
  }

  let debounceTimer = null;
  const scanInputEl = document.getElementById('scanInput');

  scanInputEl.addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      const q = e.target.value.trim();
      fuzzyCandidates = findSimilarDAs(q);
      renderFuzzyDropdown();
    }, 150);
  });

  scanInputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleScanInput(scanInputEl.value);
    }
  });

  function renderFuzzyDropdown() {
    const dd = document.getElementById('fuzzyDropdown');
    if (!fuzzyCandidates.length) { dd.style.display = 'none'; return; }
    dd.innerHTML = fuzzyCandidates.map((c, i) => `
      <div class="dropdown-item ${i === 0 ? 'active' : ''}" onclick="selectCandidate('${c.id}')">
        <span><strong>${c.name}</strong> <small style="color:var(--muted)">(${c.id})</small></span>
        <span class="badge ${c.status || 'Present'}">${c.status || c.waveTime}</span>
      </div>
    `).join('');
    dd.style.display = 'block';
  }

  function selectCandidate(empId) {
    document.getElementById('fuzzyDropdown').style.display = 'none';
    const da = state.roster.find(r => r.id === empId);
    if (da) initiateScan(da, state.scanMode);
  }

  function handleScanInput(rawText) {
    const q = String(rawText || '').trim();
    if (!q) return;
    document.getElementById('fuzzyDropdown').style.display = 'none';

    const exact = state.roster.find(r => r.id.toLowerCase() === q.toLowerCase() || r.name.toLowerCase() === q.toLowerCase());
    if (exact) {
      initiateScan(exact, state.scanMode);
      return;
    }
    const candidates = findSimilarDAs(q);
    if (candidates.length >= 1) {
      initiateScan(candidates[0], state.scanMode);
    } else {
      playTone('error');
      showBanner('No matching DA found for: ' + q, 'var(--red)');
    }
  }

  /* ==================== INITIATE SCAN & DUPLICATE GUARDS ==================== */
  async function initiateScan(da, scanType, forceAdd = false) {
    const now = Date.now();
    // 150ms global guard + 2500ms same-ID lock
    if (now - lastScanEpoch < 150) return;
    if (da.id === lastScannedId && now - lastSameIdEpoch < 2500 && !forceAdd) {
      showBanner('Duplicate scan blocked (2.5s lock)', 'var(--amber)');
      return;
    }
    lastScanEpoch = now;
    lastScannedId = da.id;
    lastSameIdEpoch = now;

    scanInputEl.value = '';
    scanInputEl.focus();

    const action = scanType === 'CHECK_IN' ? 'recordCheckIn' : 'markEntry';
    const payload = { action, employeeId: da.id, timestamp: new Date().toISOString(), scanType, forceAdd };

    const res = await apiCall(payload, true);
    if (!res) return;

    if (res.success) {
      playTone('success');
      showBanner(res.message, 'var(--green)');
      refreshRoster(true);
    } else if (res.code === 'COOLDOWN_FORCE_CONFIRM') {
      playTone('warn');
      if (confirm(res.message)) {
        initiateScan(da, scanType, true);
      }
    } else if (res.code === 'VIOLATOR_BLOCK' || res.code === 'ENTRY_REFUSED') {
      playTone('error');
      activeViolatorId = da.id;
      document.getElementById('violatorModalText').textContent = `${da.name} (${da.id}) waited ${res.minutesWaiting} min. Allow Entry or Remove?`;
      document.getElementById('violatorModal').style.display = 'flex';
      refreshRoster(true);
    } else {
      playTone('error');
      showBanner(res.message || 'Scan blocked', 'var(--red)');
    }
  }

  async function resolveViolatorModal(decision) {
    document.getElementById('violatorModal').style.display = 'none';
    if (!activeViolatorId) return;
    const res = await apiCall({ action: 'resolveViolator', employeeId: activeViolatorId, decision });
    if (res && res.success) {
      playTone('success');
      showBanner(res.message, 'var(--green)');
      refreshRoster(true);
    }
  }

  /* ==================== NETWORK & OFFLINE QUEUE ==================== */
  async function apiCall(payload, queueIfOffline = false) {
    if (!SCANNER_API_URL || SCANNER_API_URL.includes('PASTE_')) {
      showBanner('Set Apps Script Deployment #1 URL in Settings first', 'var(--amber)');
      return null;
    }
    try {
      const r = await fetch(SCANNER_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await r.json();
      setOnlineState(true);
      return data;
    } catch (err) {
      setOnlineState(false);
      if (queueIfOffline) {
        state.offlineQueue.push(payload);
        localStorage.setItem('DUD3_QUEUE', JSON.stringify(state.offlineQueue));
        document.getElementById('queueCount').textContent = state.offlineQueue.length;
        playTone('warn');
        showBanner('Offline: Scan queued locally & will sync automatically', 'var(--amber)');
      }
      return null;
    }
  }

  function setOnlineState(online) {
    const el = document.getElementById('netStatus');
    el.textContent = online ? 'ONLINE' : 'OFFLINE';
    el.className = 'status-pill' + (online ? '' : ' offline');
  }

  async function flushOfflineQueue() {
    if (!state.offlineQueue.length) return;
    const copy = [...state.offlineQueue];
    for (const item of copy) {
      const res = await apiCall(item, false);
      if (res) {
        state.offlineQueue.shift();
        localStorage.setItem('DUD3_QUEUE', JSON.stringify(state.offlineQueue));
        document.getElementById('queueCount').textContent = state.offlineQueue.length;
      } else break;
    }
  }

  /* ==================== RENDERING TABS ==================== */
  async function refreshRoster(force = false) {
    await flushOfflineQueue();
    const res = await apiCall({ action: 'rosterFull', forceRefresh: force });
    if (!res || !res.success) return;

    state.roster = res.roster || [];
    state.waitingBatches = res.waitingBatches || [{ batch: 1, members: [] }];
    state.violators = res.violators || [];
    state.scanHistory = res.scanHistory || [];
    state.settings = res.settings || state.settings;

    localStorage.setItem('DUD3_ROSTER', JSON.stringify(state.roster));
    localStorage.setItem('DUD3_BATCHES', JSON.stringify(state.waitingBatches));

    document.getElementById('dayLabel').textContent = `Tab: ${res.todayName}`;
    document.getElementById('rosterCount').textContent = state.roster.length;
    document.getElementById('violCount').textContent = state.violators.length;

    renderRecentScans();
    displayWaitingList();
    renderViolators();
    renderBreaks('onBreak');
  }

  function renderRecentScans() {
    const el = document.getElementById('recentScansList');
    if (!state.scanHistory.length) { el.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;">No scans yet today.</div>'; return; }
    el.innerHTML = state.scanHistory.slice(0, 12).map(s => `
      <div class="row-item">
        <div><strong>${s.name}</strong> <small style="color:var(--muted)">(${s.id})</small></div>
        <div><span class="badge Present">${s.type}</span> <small style="color:var(--muted)">${s.time}</small></div>
      </div>
    `).join('');
  }

  function checkBreakClient(breakStr) {
    if (!breakStr || breakStr === '--') return null;
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    for (const w of String(breakStr).split(',')) {
      const p = w.trim().split('-');
      if (p.length !== 2) continue;
      const toM = (s) => { const [h, m] = s.trim().split(':').map(Number); return h * 60 + m; };
      const s = toM(p[0]), e = toM(p[1]);
      if ((s <= e && nowMin >= s && nowMin < e) || (s > e && (nowMin >= s || nowMin < e))) {
        return p[1].trim();
      }
    }
    return null;
  }

  function displayWaitingList() {
    const q = (document.getElementById('waitSearch').value || '').toLowerCase();
    let totalWaiting = 0;
    const container = document.getElementById('waitingBatchesContainer');
    container.innerHTML = state.waitingBatches.map(b => {
      const filtered = (b.members || []).filter(m => !q || m.name.toLowerCase().includes(q) || m.id.toLowerCase().includes(q));
      totalWaiting += (b.members || []).length;
      return `
        <div style="margin-bottom:14px;">
          <div style="font-weight:800;color:var(--prime);margin-bottom:6px;">Batch ${b.batch} (${filtered.length}/25)</div>
          ${filtered.map(m => {
            const waitedMin = Math.max(0, Math.floor((Date.now() - m.checkInEpoch) / 60000));
            const backAt = checkBreakClient(m.breakHours);
            return `
              <div class="row-item" style="${backAt ? 'opacity:0.55;' : ''}">
                <div>
                  <strong>${m.name}</strong> <small style="color:var(--muted)">(${m.id})</small>
                  <div style="font-size:0.75rem;color:var(--muted)">Waited ${waitedMin}m</div>
                </div>
                <div style="display:flex;gap:6px;align-items:center;">
                  ${backAt ? `<span class="badge Break">On break – back ${backAt}</span>` : `<span class="badge ${m.status}">${m.status}</span>`}
                  ${!backAt ? `<button class="btn success" style="padding:5px 8px;font-size:0.75rem;" onclick="initiateScan({id:'${m.id}',name:'${m.name}'}, 'ENTRY')">Dispatch</button>` : ''}
                  <button class="btn danger" style="padding:5px 8px;font-size:0.75rem;" onclick="removeWaitingDA('${m.id}')">Remove</button>
                </div>
              </div>
            `;
          }).join('') || '<div style="color:var(--muted);font-size:0.8rem;">Empty</div>'}
        </div>
      `;
    }).join('');
    document.getElementById('waitCount').textContent = totalWaiting;
  }

  async function removeWaitingDA(empId) {
    await apiCall({ action: 'removeWaiting', employeeId: empId });
    refreshRoster(true);
  }

  function renderBreaks(filterType) {
    const el = document.getElementById('breaksList');
    const items = state.roster.filter(r => r.breakHours && r.breakHours !== '--');
    el.innerHTML = items.map(r => {
      const backAt = checkBreakClient(r.breakHours);
      const status = backAt ? 'onBreak' : 'upcoming';
      if (filterType === 'onBreak' && !backAt) return '';
      return `
        <div class="row-item">
          <div><strong>${r.name}</strong> <small>(${r.id})</small></div>
          <div><span class="badge Break">${r.breakHours}</span></div>
        </div>
      `;
    }).join('') || '<div style="color:var(--muted);padding:8px;">No DAs in this break category.</div>';
  }

  function renderViolators() {
    const el = document.getElementById('violatorsList');
    if (!state.violators.length) { el.innerHTML = '<div style="color:var(--muted)">No active violators.</div>'; return; }
    el.innerHTML = state.violators.map(v => `
      <div class="row-item">
        <label style="display:flex;gap:8px;align-items:center;">
          <input type="checkbox" class="viol-chk" value="${v.id}" />
          <span><strong>${v.name}</strong> (${v.id}) — Waited ${v.minutesWaiting}m</span>
        </label>
        <button class="btn secondary" style="padding:4px 8px;font-size:0.75rem;" onclick="activeViolatorId='${v.id}';document.getElementById('violatorModalText').textContent='${v.name} (${v.id})';document.getElementById('violatorModal').style.display='flex'">Action</button>
      </div>
    `).join('');
  }

  async function clearSelectedViolators() {
    const ids = Array.from(document.querySelectorAll('.viol-chk:checked')).map(c => c.value);
    if (!ids.length) return;
    await apiCall({ action: 'clearViolators', employeeIds: ids });
    refreshRoster(true);
  }

  function setScanMode(mode) {
    state.scanMode = mode;
    document.getElementById('modeCheckIn').className = mode === 'CHECK_IN' ? 'btn' : 'btn secondary';
    document.getElementById('modeEntry').className = mode === 'ENTRY' ? 'btn' : 'btn secondary';
    scanInputEl.focus();
  }

  function switchTab(tab, btn) {
    ['scan', 'waiting', 'breaks', 'violators', 'settings'].forEach(t => {
      document.getElementById('tab-' + t).style.display = (t === tab) ? 'block' : 'none';
    });
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  async function saveSheetLink() {
    const api = document.getElementById('cfgApiUrl').value.trim();
    if (api) { SCANNER_API_URL = api; localStorage.setItem('DUD3_API_URL', api); }
    const url = document.getElementById('cfgSheetUrl').value.trim();
    if (url) {
      const res = await apiCall({ action: 'saveSheetUrl', sheetUrl: url });
      if (res) showBanner(res.message);
    }
    refreshRoster(true);
  }

  async function unlinkSheet() {
    const res = await apiCall({ action: 'saveSheetUrl', sheetUrl: '' });
    if (res) showBanner(res.message);
  }

  async function saveSettingsToServer() {
    const settings = {
      preWaveBlockMin: Number(document.getElementById('cfgPreWave').value),
      presentWindowMin: Number(document.getElementById('cfgPresentWin').value),
      entryTimeoutMin: Number(document.getElementById('cfgEntryTimeout').value),
      manualBreakOverride: document.getElementById('cfgBreakOverride').checked
    };
    const res = await apiCall({ action: 'saveSettings', settings });
    if (res && res.success) showBanner('Settings saved');
  }

  async function triggerStartNewDay() {
    if (!confirm('Reset waiting batches & violators for a new day?')) return;
    const res = await apiCall({ action: 'startNewDay' });
    if (res && res.success) { showBanner(res.message); refreshRoster(true); }
  }

  function exportRosterCSV() {
    const headers = ['Name','Employee ID','Wave Time','Break Hours','Status','Check-in Time','Turns','Entry Time','Out on Road Time'];
    const rows = state.roster.map(r => [r.name, r.id, r.waveTime, r.breakHours, r.status, r.checkInTime, r.turns, r.entryTime, r.outOnRoadTime]);
    const csv = [headers, ...rows].map(e => e.map(x => `"${String(x || '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `DUD3_Attendance_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  // Init
  document.getElementById('cfgApiUrl').value = SCANNER_API_URL;
  refreshRoster(false);
  setInterval(displayWaitingList, 30000);
</script>
</body>
</html>
