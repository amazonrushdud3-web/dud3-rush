  <style>
    :root {
      --bg: #0B1118;
      --bg-grad: radial-gradient(1200px 600px at 100% -10%, rgba(255,153,0,0.08), transparent 55%),
                 radial-gradient(900px 500px at -10% 110%, rgba(35,131,226,0.10), transparent 55%),
                 #0B1118;
      --card: #16202C;
      --card-alt: #111B25;
      --card-hi: #1C2938;
      --border: #273645;
      --border-soft: #1E2A37;
      --orange: #FF9900;
      --orange-2: #FF7A00;
      --orange-glow: rgba(255, 153, 0, 0.28);
      --blue: #2383E2;
      --green: #16C784;
      --green-soft: #0C3A2A;
      --red: #FF4D4F;
      --red-soft: #3A1416;
      --yellow: #FFC53D;
      --text: #F3F6FA;
      --text-dim: #8FA0B4;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 28px rgba(0,0,0,0.42);
      --shadow-soft: 0 4px 16px rgba(0,0,0,0.28);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; max-width: 100%; overflow-x: hidden; }
    img, svg, video { max-width: 100%; height: auto; }

    body {
      background: var(--bg-grad);
      background-attachment: fixed;
      color: var(--text);
      height: 100dvh;
      max-width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(180deg, rgba(22,32,44,0.96), rgba(17,27,37,0.92));
      backdrop-filter: saturate(140%) blur(8px);
      -webkit-backdrop-filter: saturate(140%) blur(8px);
      border-bottom: 1px solid var(--border-soft);
      padding: calc(var(--safe-top) + 8px) 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 100;
    }
    .brand-wrap { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #FF9900, #FF6A00);
      border-radius: 10px; display: grid; place-items: center;
      font-weight: 900; font-size: 15px; color: #000;
      box-shadow: 0 4px 14px var(--orange-glow);
    }
    .brand-title { font-size: 16px; font-weight: 800; letter-spacing: 0.4px; }
    .brand-title span { color: var(--orange); }
    .brand-sub { font-size: 10px; color: var(--text-dim); font-weight: 600; letter-spacing: 1px; }
    .top-status { display: flex; align-items: center; gap: 8px; }
    .sync-badge {
      font-size: 11px; padding: 4px 8px; background: #102A1C;
      color: var(--green); border: 1px solid #1E5030; border-radius: 999px;
      font-weight: 700; display: flex; align-items: center; gap: 4px;
    }
    .sync-badge.syncing { background: #2D2513; color: var(--orange); border-color: #554010; }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .clock-display {
      font-size: 13px; font-weight: 700; color: #FFF;
      font-variant-numeric: tabular-nums; background: var(--card-hi);
      padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border);
    }

    #banner-holder { position: relative; z-index: 95; }
    .banner {
      padding: 10px 14px; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: space-between;
      animation: slideDown 0.2s ease-out; border-bottom: 1px solid rgba(0,0,0,0.2);
    }
    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .banner-warning { background: #D97706; color: #FFF; }
    .banner-danger { background: #DC2626; color: #FFF; }
    .banner-success { background: #059669; color: #FFF; }
    .banner-close { cursor: pointer; font-size: 18px; font-weight: 900; padding: 0 6px; }

    main {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 12px 14px calc(var(--safe-bottom) + 75px);
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .tab-content { display: none; flex-direction: column; gap: 12px; }
    .tab-content.active { display: flex; }

    .scanner-card, .batch-card, .replacement-box, .metric-box {
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .scanner-card {
      background: var(--card); padding: 12px; display: flex;
      flex-direction: column; align-items: center;
    }
    .scanner-viewport-wrap {
      position: relative; width: 100%; max-width: 320px; height: auto; aspect-ratio: 1 / 1;
      background: #000; border-radius: 14px; overflow: hidden;
      border: 2px solid #2B3E52;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), var(--shadow-soft);
    }
    #qr-reader-attend, #qr-reader-waiting, #qr-reader-receive {
      width: 100% !important; height: 100% !important;
    }
    #qr-reader-attend video, #qr-reader-waiting video, #qr-reader-receive video {
      object-fit: cover !important; width: 100% !important; height: 100% !important;
    }

    .scanner-idle {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px; z-index: 12;
      color: var(--text-dim); text-align: center; padding: 16px;
      background: radial-gradient(120px 120px at 50% 42%, rgba(255,153,0,0.06), transparent 70%), #05090D;
    }
    .scanner-idle svg { width: 46px; height: 46px; fill: var(--orange); opacity: 0.9; }
    .scanner-idle .idle-title { font-size: 13px; font-weight: 800; color: var(--text); letter-spacing: .3px; }
    .scanner-idle .idle-sub { font-size: 11px; font-weight: 600; }
    .scanner-wrap-active .scanner-idle { display: none; }
    .scanner-wrap-active .laser-line, .scanner-wrap-active .corner-bracket { display: block; }
    .laser-line, .corner-bracket { display: none; }

    .laser-line {
      position: absolute; width: 100%; height: 3px;
      background: linear-gradient(90deg, transparent, #FF9900, #FF3300, transparent);
      box-shadow: 0 0 10px #FF9900; top: 0; left: 0;
      animation: scanLaser 2.0s infinite ease-in-out; pointer-events: none; z-index: 10;
    }
    @keyframes scanLaser {
      0% { top: 6%; opacity: 0.2; }
      50% { top: 92%; opacity: 1; }
      100% { top: 6%; opacity: 0.2; }
    }
    .corner-bracket {
      position: absolute; width: 20px; height: 20px;
      border-color: var(--orange); border-style: solid; pointer-events: none; z-index: 9;
    }
    .cb-tl { top: 10px; left: 10px; border-width: 3px 0 0 3px; }
    .cb-tr { top: 10px; right: 10px; border-width: 3px 3px 0 0; }
    .cb-bl { bottom: 10px; left: 10px; border-width: 0 0 3px 3px; }
    .cb-br { bottom: 10px; right: 10px; border-width: 0 3px 3px 0; }

    .scanner-controls {
      display: flex; gap: 8px; width: 100%; max-width: 320px; margin-top: 10px;
    }
    .scanner-controls .btn { flex: 1; padding: 11px 10px; font-size: 13px; }
    .scan-status-chip {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
      font-size: 11px; font-weight: 700; color: var(--text-dim);
      padding: 4px 10px; border-radius: 999px; background: var(--card-alt); border: 1px solid var(--border);
    }
    .scan-status-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #55697E; }
    .scan-status-chip.live { color: var(--green); border-color: #1E5030; }
    .scan-status-chip.live .dot { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulseDot 1.1s infinite; }
    @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:.35;} }

    .scanner-input-bar { width: 100%; margin-top: 10px; display: flex; gap: 8px; position: relative; }
    .text-input {
      flex: 1; background: var(--card-alt); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 12px; color: #FFF;
      font-size: 14px; outline: none; user-select: text; min-height: 42px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .text-input:focus { border-color: var(--orange); box-shadow: 0 0 0 2px var(--orange-glow); }
    .btn {
      background: linear-gradient(180deg, #FFAD1F, #FF8F00); color: #000; font-weight: 800;
      border: none; border-radius: var(--radius-sm); padding: 10px 14px; min-height: 42px;
      font-size: 13px; cursor: pointer; display: flex;
      align-items: center; gap: 6px; justify-content: center;
      white-space: nowrap; box-shadow: 0 4px 12px rgba(255,153,0,0.22);
      transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease, filter .12s ease;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn:active { transform: translateY(1px) scale(0.98); box-shadow: 0 2px 6px rgba(255,153,0,0.18); }
    .btn-green { background: linear-gradient(180deg, #1ED48C, #10B478); color: #052015; box-shadow: 0 4px 12px rgba(22,199,132,0.22); }
    .btn-card { background: var(--card-hi); color: #FFF; border: 1px solid #334760; box-shadow: none; }
    .btn-card:hover { background: #223042; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); box-shadow: none; }
    .btn-danger { background: linear-gradient(180deg, #FF5A5C, #E03234); color: #fff; box-shadow: 0 4px 12px rgba(255,77,79,0.22); }

    .search-results-dropdown {
      position: absolute; top: 44px; left: 0; right: 0;
      background: #1B2634; border: 1px solid var(--orange);
      border-radius: 8px; max-height: 210px; overflow-y: auto;
      z-index: 150; box-shadow: 0 10px 28px rgba(0,0,0,0.65); display: none;
    }
    .dropdown-item {
      padding: 10px 12px; border-bottom: 1px solid #233142;
      cursor: pointer; font-size: 13px; display: flex;
      justify-content: space-between; align-items: center;
    }
    .dropdown-item:active { background: #25364A; }

    .wave-bar {
      display: flex; align-items: center; gap: 6px; overflow-x: auto;
      padding-bottom: 2px; scrollbar-width: none;
    }
    .wave-pill {
      padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800;
      background: var(--card); border: 1px solid var(--border); color: var(--text-dim);
      cursor: pointer; white-space: nowrap; transition: all .15s ease;
    }
    .wave-pill.active {
      background: var(--orange); color: #000; border-color: var(--orange);
      box-shadow: 0 4px 12px var(--orange-glow);
    }

    .metric-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .metric-box {
      background: linear-gradient(180deg, var(--card-hi), var(--card-alt));
      padding: 12px 8px; text-align: center;
    }
    .metric-val { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
    .metric-lbl { font-size: 10px; font-weight: 600; color: var(--text-dim); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.6px; }

    .replacement-box {
      background: linear-gradient(145deg, #1A2635, #151F2C);
      border: 1px solid #334960; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .rep-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 420px) { .rep-grid { grid-template-columns: 1fr; } }

    .batch-card { background: linear-gradient(180deg, var(--card), var(--card-alt)); overflow: hidden; }
    .batch-card:hover { border-color: #31485E; box-shadow: var(--shadow); }
    .batch-card.break-return { border-color: #1E5030; box-shadow: 0 6px 18px rgba(22,199,132,0.18); }
    .batch-card.break-return .batch-header { background: linear-gradient(90deg, #0E2B20, #12201A); }
    .batch-header {
      background: #182330; padding: 11px 14px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border);
      flex-wrap: wrap; gap: 8px; min-width: 0;
    }
    .batch-title { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .batch-badge { background: #FF9900; color: #000; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
    .batch-actions { display: flex; gap: 6px; align-items: center; }
    .da-list { display: flex; flex-direction: column; }
    .da-row {
      display: flex; align-items: center; padding: 10px 14px;
      border-bottom: 1px solid #182431; gap: 10px; font-size: 13px; min-width: 0;
      transition: background .12s ease;
    }
    .da-row:hover { background: rgba(255,255,255,0.03); }
    .da-row:last-child { border-bottom: none; }
    .da-checkbox { width: 18px; height: 18px; accent-color: var(--orange); cursor: pointer; }
    .da-details { flex: 1; min-width: 0; }
    .da-title-line { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; min-width: 0; }

    nav {

    #splash-screen {

      background: radial-gradient(600px 400px at 50% 38%, rgba(255,153,0,0.10), transparent 60%), #070B0F;
      z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;

    .radar-circle {
      width: 110px; height: 110px; border-radius: 50%;

    }

    .package-laser {

      animation: shimmer 2.2s linear infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
