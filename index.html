<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DUD3 Rush PRO Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#131A22">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg-dark: #0F141C; --bg-primary: #131A22; --bg-secondary: #1B2430;
      --bg-card: #232F3E; --bg-card-hover: #2C3B4E;
      --accent-orange: #FF9900; --accent-blue: #00A8E1;
      --text-main: #FFFFFF; --text-muted: #9BA7B6;
      --success: #00C853; --danger: #FF3B30; --warn: #FFB300;
      --border: #354558; --radius: 10px; --nav-h: 66px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; overflow-x: hidden; background: var(--bg-primary); color: var(--text-main); font-family: var(--font-sans); font-size: 14px; }
    body { min-height: 100vh; display: flex; flex-direction: column; padding-bottom: calc(var(--nav-h) + 20px); }
    
    #top-alert-banner { position: fixed; top: 8px; left: 50%; transform: translateX(-50%) translateY(-150%); width: calc(100% - 24px); max-width: 540px; padding: 11px 16px; border-radius: 8px; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: space-between; z-index: 10000; box-shadow: 0 8px 24px rgba(0,0,0,0.65); transition: transform 0.28s; }
    #top-alert-banner.show { transform: translateX(-50%) translateY(0); }
    #top-alert-banner.banner-success { background: #00C853; color: #062010; }
    #top-alert-banner.banner-danger { background: #FF3B30; color: #FFFFFF; }
    #top-alert-banner.banner-warn { background: #FFB300; color: #1A1300; }

    header { position: sticky; top: 0; z-index: 500; background: rgba(35, 47, 62, 0.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 6px; font-weight: 900; color: var(--accent-orange); }
    .status-pill { padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: 800; }
    .status-pill.online { background: rgba(0,200,83,0.18); color: var(--success); border: 1px solid var(--success); }
    .status-pill.offline { background: rgba(255,179,0,0.18); color: var(--warn); border: 1px solid var(--warn); }
    
    main { width: 100%; max-width: 860px; margin: 0 auto; padding: 12px; flex: 1; }
    .tab-pane { display: none; } .tab-pane.active { display: block; }
    
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
    .card-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px;}
    .card-title { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); }
    
    .input, select.input { width: 100%; background: var(--bg-primary); color: #fff; border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; font-size: 14px; }
    .btn { background: var(--accent-orange); color: #111; border: none; border-radius: 7px; padding: 9px 13px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .btn-secondary { background: var(--bg-secondary); color: #fff; border: 1px solid var(--border); }
    .btn-blue { background: var(--accent-blue); color: #051B24; }
    .btn-danger { background: rgba(255,59,48,0.18); color: var(--danger); border: 1px solid var(--danger); }
    .btn-sm { padding: 5px 9px; font-size: 11px; }
    
    .da-list { display: flex; flex-direction: column; gap: 6px; }
    .da-item { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
    .da-info { flex: 1; } .da-name { font-weight: 700; font-size: 13px; } .da-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    
    .badge { padding: 3px 7px; border-radius: 5px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .b-absent { background: rgba(255,59,48,0.18); color: var(--danger); border: 1px solid var(--danger); }
    
    #cam-box, #cam-box-waiting { display: none; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    
    nav.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--bg-card); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 900; }
    .nav-item { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; cursor: pointer; }
    .nav-item.active { color: var(--accent-orange); } .nav-item svg { width: 20px; height: 20px; fill: currentColor; margin-bottom: 3px;}
  </style>
</head>
<body>

  <div id="top-alert-banner"><span id="top-alert-text"></span></div>

  <header>
    <div class="brand">⚡ RUSH PRO DUD3</div>
    <div><span id="sync-status-pill" class="status-pill online">ONLINE</span></div>
  </header>

  <main>
    <!-- 1. ATTENDANCE TAB (Live List Removed) -->
    <section id="pane-attendance" class="tab-pane active">
      <div class="card">
        <div class="card-hdr">
          <div class="card-title">1. Morning Attendance Scan</div>
          <button class="btn btn-sm btn-secondary" id="btn-cam-toggle">Camera</button>
        </div>
        <div id="cam-box"><div id="qr-reader-att"></div></div>
        <input type="text" id="inp-checkin" class="input" placeholder="Scan or type DA ID for Attendance..." autocomplete="off">
      </div>

      <div class="card" style="border-color: var(--accent-orange);">
        <div class="card-hdr">
          <div class="card-title" style="color:var(--accent-orange);">2. Replacement DA Management</div>
        </div>
        <select id="sel-absent-driver" class="input" style="margin-bottom:8px;"><option value="">-- Select Absent Driver --</option></select>
        <input type="text" id="inp-custom-repl" class="input" placeholder="Enter Replacement (NAME - ID)" style="margin-bottom:8px;">
        <button class="btn" id="btn-confirm-replacement">Check-In Replacement</button>
      </div>
    </section>

    <!-- 2. WAITING LIST TAB (Formerly Batches) -->
    <section id="pane-batches" class="tab-pane">
      <div class="card" style="border-color: var(--accent-blue);">
        <div class="card-hdr">
          <div class="card-title" style="color:var(--accent-blue);">📥 Add DA to Waiting List (Turn 2+)</div>
          <button class="btn btn-sm btn-secondary" id="btn-cam-waiting-toggle">Camera</button>
        </div>
        <div id="cam-box-waiting"><div id="qr-reader-wait"></div></div>
        <input type="text" id="inp-requeue-da" class="input" placeholder="Scan DA to add directly to Waiting List..." autocomplete="off">
      </div>

      <div class="card">
        <div class="card-hdr">
          <div class="card-title">📦 Active Waiting List / Batches</div>
          <button class="btn btn-sm" id="btn-reg-send-selected">Send Selected</button>
        </div>
        <div id="regular-batches-container"></div>
      </div>
    </section>

    <!-- 3. BRIDGE TAB (OP Tracking) -->
    <section id="pane-bridge" class="tab-pane">
      <div class="card">
        <div class="card-hdr"><div class="card-title">⏱️ Pending Arrival List (Sent from OP)</div></div>
        <div id="pending-arrival-list" class="da-list"></div>
      </div>
      <div class="card" style="border-color: var(--danger);">
        <div class="card-hdr"><div class="card-title" style="color:var(--danger);">⚠️ Violators List</div></div>
        <div id="violators-list" class="da-list"></div>
      </div>
    </section>

    <!-- 4. BREAKS TAB -->
    <section id="pane-breaks" class="tab-pane">
      <div class="card">
        <div class="card-hdr"><div class="card-title">☕ Active Breaks</div></div>
        <div id="active-breaks-list" class="da-list"></div>
      </div>
    </section>

    <!-- 5. SETTINGS TAB -->
    <section id="pane-settings" class="tab-pane">
      <div class="card">
        <div class="card-title" style="margin-bottom:10px;">⚙️ System Settings</div>
        <label style="font-size:11px; color:var(--text-muted);">Apps Script URL</label>
        <input type="text" id="set-api-url" class="input" style="margin-bottom:10px;">
        <label style="font-size:11px; color:var(--text-muted);">Google Sheet URL</label>
        <input type="text" id="set-sheet-url" class="input" style="margin-bottom:10px;">
        <button class="btn" id="btn-save-settings">Save Settings</button>
        <button class="btn btn-secondary" id="btn-load-demo">Load Demo Data</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-target="pane-attendance"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg><span>Attendance</span></button>
    <button class="nav-item" data-target="pane-batches"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg><span>Waiting List</span></button>
    <button class="nav-item" data-target="pane-bridge"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg><span>OP Bridge</span></button>
    <button class="nav-item" data-target="pane-breaks"><svg viewBox="0 0 24 24"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg><span>Breaks</span></button>
    <button class="nav-item" data-target="pane-settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58z"/></svg><span>Settings</span></button>
  </nav>

  <script>
    let STATE = { roster: [], batches: [], pendingArrivals: [], violators: [], selectedRegSet: new Set() };
    
    function showBanner(msg, type="success") {
      const b = document.getElementById("top-alert-banner");
      document.getElementById("top-alert-text").textContent = msg;
      b.className = "show banner-" + type;
      setTimeout(() => b.className = "", 3000);
    }

    function nowHHMM() {
      const d = new Date(); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
    }

    function loadDemo() {
      STATE.roster = [
        { daId: "A1QADDOOS991", daName: "Abdul Qaddoos Tariq", status: "Absent", waveTime: "08:00", originalBatchId: null },
        { daId: "A2MUDASSAR882", daName: "Muhammad Mudassar", status: "", waveTime: "10:00", originalBatchId: null }
      ];
      renderAll();
    }

    // 1. Morning Attendance Scan Logic
    function handleAttendanceScan(id) {
      const da = STATE.roster.find(r => r.daId.toLowerCase() === id.trim().toLowerCase());
      if(da) {
        da.status = "Present";
        da.scanTime = nowHHMM();
        queueIntoBatch(da);
        showBanner(`Attendance Marked: ${da.daName}`, "success");
        renderAll();
      } else {
        showBanner("DA Not Found in Roster", "danger");
      }
    }

    // 2. Waiting List Scan Logic (Add directly to batch without overriding morning attendance)
    function handleWaitingListScan(id) {
      const da = STATE.roster.find(r => r.daId.toLowerCase() === id.trim().toLowerCase());
      if(da) {
        queueIntoBatch(da);
        da.turns = (da.turns || 1) + 1; // Increment turn
        showBanner(`Added to Waiting List: ${da.daName} (Turn ${da.turns})`, "success");
        renderAll();
      } else {
        showBanner("DA Not Found", "danger");
      }
    }

    function queueIntoBatch(da) {
      let b = STATE.batches.find(x => !x.completed && x.members.length < 25);
      if(!b) {
        b = { batchId: STATE.batches.length + 1, completed: false, members: [] };
        STATE.batches.push(b);
      }
      if(!b.members.find(m => m.daId === da.daId)) {
        b.members.push({ daId: da.daId, daName: da.daName, sent: false, scanTime: nowHHMM() });
      }
    }

    function sendToOP(members) {
      members.forEach(m => {
        m.sent = true;
        STATE.pendingArrivals.push({ daId: m.daId, daName: m.daName, sentAtMs: Date.now() });
      });
      showBanner(`Sent ${members.length} DAs to OP`, "success");
      renderAll();
    }

    function renderAll() {
      // Absent List for Replacement
      const selAbsent = document.getElementById("sel-absent-driver");
      selAbsent.innerHTML = `<option value="">-- Select Absent Driver --</option>` + 
        STATE.roster.filter(r => r.status === "Absent").map(d => `<option value="${d.daId}">${d.daName}</option>`).join("");

      // Batches / Waiting List
      const regWrap = document.getElementById("regular-batches-container");
      const openBatches = STATE.batches.filter(b => b.members.some(m => !m.sent));
      regWrap.innerHTML = openBatches.map(b => `
        <div style="background:var(--bg-primary); padding:10px; border-radius:8px; margin-bottom:10px;">
          <strong>Batch ${b.batchId}</strong>
          ${b.members.filter(m=>!m.sent).map(m => `
            <div class="da-item" style="margin-top:5px;">
              <div><input type="checkbox" class="reg-chk" data-id="${m.daId}"> ${m.daName}</div>
            </div>
          `).join("")}
        </div>
      `).join("");

      document.querySelectorAll(".reg-chk").forEach(c => {
        c.onchange = (e) => { if(e.target.checked) STATE.selectedRegSet.add(e.target.dataset.id); else STATE.selectedRegSet.delete(e.target.dataset.id); }
      });

      // Pending Arrivals
      document.getElementById("pending-arrival-list").innerHTML = STATE.pendingArrivals.map(p => `
        <div class="da-item"><div>${p.daName}</div></div>
      `).join("");
    }

    // Input Events
    document.getElementById("inp-checkin").addEventListener("keydown", e => { if(e.key==="Enter") { handleAttendanceScan(e.target.value); e.target.value=""; }});
    document.getElementById("inp-requeue-da").addEventListener("keydown", e => { if(e.key==="Enter") { handleWaitingListScan(e.target.value); e.target.value=""; }});
    document.getElementById("btn-load-demo").onclick = loadDemo;
    document.getElementById("btn-reg-send-selected").onclick = () => {
      let toSend = [];
      STATE.batches.forEach(b => b.members.forEach(m => { if(!m.sent && STATE.selectedRegSet.has(m.daId)) toSend.push(m); }));
      sendToOP(toSend); STATE.selectedRegSet.clear();
    };

    // Nav Logic
    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.getAttribute("data-target")).classList.add("active");
      };
    });

    // Scanner logic
    let scannerAtt = null, scannerWait = null;
    document.getElementById("btn-cam-toggle").onclick = () => {
      const box = document.getElementById("cam-box");
      if(box.style.display==="block") { box.style.display="none"; if(scannerAtt) scannerAtt.stop(); }
      else { box.style.display="block"; scannerAtt = new Html5Qrcode("qr-reader-att"); scannerAtt.start({facingMode:"environment"}, {fps:10}, text => { handleAttendanceScan(text); }); }
    };
    document.getElementById("btn-cam-waiting-toggle").onclick = () => {
      const box = document.getElementById("cam-box-waiting");
      if(box.style.display==="block") { box.style.display="none"; if(scannerWait) scannerWait.stop(); }
      else { box.style.display="block"; scannerWait = new Html5Qrcode("qr-reader-wait"); scannerWait.start({facingMode:"environment"}, {fps:10}, text => { handleWaitingListScan(text); }); }
    };
  </script>
</body>
</html>
