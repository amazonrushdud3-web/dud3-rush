<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Amazon RUSH & ANOW — Last-Mile Delivery API</title>
  <style>
    /* ==========================================================================
       1. BRAND TOKENS & CUSTOM PROPERTIES
       ========================================================================== */
    :root {
      --bg-deep: #060911;
      --bg-card: rgba(13, 20, 34, 0.78);
      --amz-orange: #FF9900;
      --amz-cyan: #00A8E1;
      --amz-blue: #146EB4;
      --status-green: #22C55E;
      --text-primary: #F8FAFC;
      --text-muted: #94A3B8;
      --border-subtle: rgba(255, 255, 255, 0.09);

      /* Animation Easings */
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       2. SPLASH SCREEN OVERLAY & RADIAL GLOWS
       ========================================================================== */
    #rush-anow-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(circle at 12% 15%, rgba(0, 168, 225, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 88% 85%, rgba(255, 153, 0, 0.20) 0%, transparent 48%),
        radial-gradient(circle at 50% 50%, rgba(20, 110, 180, 0.12) 0%, transparent 65%);
      opacity: 1;
      visibility: visible;
      transition: opacity 500ms var(--ease-out-expo), visibility 500ms var(--ease-out-expo);
      overflow: hidden;
    }

    #rush-anow-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ==========================================================================
       3. PERSPECTIVE GRID FLOOR
       ========================================================================== */
    .splash-grid-floor {
      position: absolute;
      inset: -40%;
      background-size: 48px 48px;
      background-image:
        linear-gradient(to right, rgba(0, 168, 225, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(20, 110, 180, 0.12) 1px, transparent 1px);
      transform: perspective(650px) rotateX(62deg) scale(0.85) translateY(10%);
      transform-origin: center center;
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.95) 10%, transparent 68%);
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.95) 10%, transparent 68%);
      opacity: 0;
      transition: opacity 900ms var(--ease-out-expo), transform 900ms var(--ease-out-expo);
      pointer-events: none;
    }

    /* ==========================================================================
       4. STAGE CARD & DIAGONAL LIGHT SWEEP
       ========================================================================== */
    .splash-stage {
      position: relative;
      width: 100%;
      max-width: 460px;
      padding: 48px 28px 42px;
      border-radius: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      box-shadow:
        0 30px 70px -15px rgba(0, 0, 0, 0.85),
        0 0 40px rgba(0, 168, 225, 0.07),
        inset 0 1px 1px rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
      overflow: hidden;
      z-index: 2;
    }

    /* Single diagonal light sweep across the card */
    .splash-stage::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -120%;
      width: 65%;
      height: 200%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.08) 50%,
        transparent 100%
      );
      transform: rotate(25deg);
      pointer-events: none;
    }

    /* ==========================================================================
       5. ORBITING FLOATING PARTICLES
       ========================================================================== */
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 700ms ease-out;
    }

    .p1 {
      width: 8px; height: 8px;
      background: var(--amz-orange);
      box-shadow: 0 0 14px var(--amz-orange);
      top: 18%; left: 12%;
      --bob-dur: 4.2s; --bob-delay: 0s;
    }
    .p2 {
      width: 6px; height: 6px;
      background: var(--amz-cyan);
      box-shadow: 0 0 12px var(--amz-cyan);
      top: 22%; right: 14%;
      --bob-dur: 5.1s; --bob-delay: -1.4s;
    }
    .p3 {
      width: 10px; height: 10px;
      background: var(--amz-blue);
      box-shadow: 0 0 16px var(--amz-blue);
      bottom: 20%; left: 16%;
      --bob-dur: 4.8s; --bob-delay: -2.2s;
    }
    .p4 {
      width: 5px; height: 5px;
      background: var(--amz-orange);
      box-shadow: 0 0 10px var(--amz-orange);
      bottom: 24%; right: 12%;
      --bob-dur: 3.9s; --bob-delay: -0.8s;
    }

    /* ==========================================================================
       6. HERO CONTENT (LOGO, WORDMARK, SUBTITLE, STATUS PILL)
       ========================================================================== */
    .logo-wrap {
      position: relative;
      width: 92px;
      height: 92px;
      margin: 0 auto 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.45) rotate(-18deg);
      transition: opacity 650ms var(--ease-out-expo) 120ms,
                  transform 750ms var(--ease-out-back) 120ms;
    }

    /* Spinning conic-gradient ring */
    .logo-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        var(--amz-orange),
        var(--amz-cyan),
        var(--amz-blue),
        var(--amz-orange)
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      filter: drop-shadow(0 0 12px rgba(0, 168, 225, 0.35));
      animation: spinRing 3.2s linear infinite;
    }

    .logo-core {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #162238, #090e1a);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      line-height: 1;
      filter: drop-shadow(0 0 16px rgba(255, 153, 0, 0.65));
      user-select: none;
    }

    /* Wordmark */
    .wordmark {
      font-size: clamp(2rem, 6vw, 2.65rem);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 600ms var(--ease-out-expo) 320ms,
                  transform 600ms var(--ease-out-expo) 320ms;
    }

    .wordmark .rush {
      color: var(--amz-orange);
      text-shadow: 0 0 24px rgba(255, 153, 0, 0.38);
    }

    .wordmark .amp {
      color: var(--text-muted);
      font-weight: 600;
      margin: 0 6px;
      font-size: 0.82em;
    }

    .wordmark .anow {
      color: var(--amz-cyan);
      text-shadow: 0 0 24px rgba(0, 168, 225, 0.38);
    }

    /* Subtitle */
    .subtitle {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--text-muted);
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 550ms var(--ease-out-expo) 480ms,
                  transform 550ms var(--ease-out-expo) 480ms;
    }

    /* Status Pill Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(34, 197, 94, 0.28);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      font-size: 0.78rem;
      font-weight: 600;
      color: #E2E8F0;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 550ms var(--ease-out-expo) 660ms,
                  transform 550ms var(--ease-out-expo) 660ms;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--status-green);
      box-shadow: 0 0 10px var(--status-green);
      animation: pulseDot 1.8s ease-in-out infinite;
    }

    /* ==========================================================================
       7. ACTIVE ENTRANCE STATES (APPLIED BY JS)
       ========================================================================== */
    #rush-anow-splash.is-entering .splash-grid-floor {
      opacity: 1;
      transform: perspective(650px) rotateX(62deg) scale(1) translateY(0);
    }

    #rush-anow-splash.is-entering .logo-wrap {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    #rush-anow-splash.is-entering .wordmark,
    #rush-anow-splash.is-entering .subtitle,
    #rush-anow-splash.is-entering .status-badge {
      opacity: 1;
      transform: translateY(0);
    }

    #rush-anow-splash.is-entering .particle {
      opacity: 0.85;
      animation: floatBob var(--bob-dur, 4.5s) ease-in-out var(--bob-delay, 0s) infinite;
    }

    #rush-anow-splash.is-entering .splash-stage::after {
      animation: cardSweep 1.15s var(--ease-out-expo) 750ms 1 forwards;
    }

    /* ==========================================================================
       8. KEYFRAMES & REDUCED MOTION
       ========================================================================== */
    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.55; }
    }

    @keyframes floatBob {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(4px); }
    }

    @keyframes cardSweep {
      0% { left: -120%; }
      100% { left: 160%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-grid-floor,
      .logo-wrap,
      .wordmark,
      .subtitle,
      .status-badge,
      .particle {
        transition: opacity 200ms linear !important;
        transform: none !important;
        animation: none !important;
      }
      .logo-ring,
      .status-dot,
      .splash-stage::after {
        animation: none !important;
      }
    }

    /* ==========================================================================
       9. DEMO APP SHELL BEHIND SPLASH (FOR VERIFICATION)
       ========================================================================== */
    .app-demo-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
    }
    .demo-btn {
      padding: 12px 22px;
      border-radius: 10px;
      border: 1px solid rgba(0, 168, 225, 0.4);
      background: rgba(0, 168, 225, 0.15);
      color: var(--text-primary);
      font-weight: 700;
      cursor: pointer;
      transition: background 200ms ease, transform 150ms ease;
    }
    .demo-btn:hover {
      background: rgba(0, 168, 225, 0.28);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       SPLASH OVERLAY COMPONENT
       Drop this #rush-anow-splash block into any web app
       ======================================================================== -->
  <div id="rush-anow-splash" role="status" aria-live="polite" aria-label="Loading Amazon RUSH and ANOW Dashboard">
    <!-- Perspective Grid Floor -->
    <div class="splash-grid-floor" aria-hidden="true"></div>

    <!-- Centered Stage Card -->
    <div class="splash-stage">
      <!-- Orbiting Brand Particles -->
      <span class="particle p1" aria-hidden="true"></span>
      <span class="particle p2" aria-hidden="true"></span>
      <span class="particle p3" aria-hidden="true"></span>
      <span class="particle p4" aria-hidden="true"></span>

      <!-- Hero Logo Mark -->
      <div class="logo-wrap" aria-hidden="true">
        <div class="logo-ring"></div>
        <div class="logo-core">⚡</div>
      </div>

      <!-- Brand Wordmark -->
      <h1 class="wordmark">
        <span class="rush">RUSH</span><span class="amp">&amp;</span><span class="anow">ANOW</span>
      </h1>

      <!-- Subtitle -->
      <p class="subtitle">Amazon Last-Mile Delivery API</p>

      <!-- Live Status Pill -->
      <div class="status-badge">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="splash-status-text">System Online · Connecting Services</span>
      </div>
    </div>
  </div>

  <!-- ========================================================================
       UNDERLYING DASHBOARD PLACEHOLDER (Revealed after splash hides)
       ======================================================================== -->
  <main class="app-demo-shell">
    <h2 style="font-size:1.75rem;">Amazon <span style="color:var(--amz-orange)">RUSH</span> &amp; <span style="color:var(--amz-cyan)">ANOW</span> Dashboard</h2>
    <p style="color:var(--text-muted);max-width:460px;line-height:1.5;">
      Telemetry &amp; Dispatch API connected. Use the button below or call
      <code>window.RushAnowSplash.show()</code> from your console to replay the opening sequence.
    </p>
    <button class="demo-btn" onclick="replayDemoSplash()">↻ Replay Splash Animation</button>
  </main>

  <!-- ========================================================================
       SPLASH CONTROLLER & PUBLIC JS API
       ======================================================================== -->
  <script>
    (function () {
      const splashEl = document.getElementById('rush-anow-splash');
      let autoHideTimer = null;
      let hideTransitionTimer = null;

      /**
       * Triggers the entrance animation classes safely regardless of when
       * the script executes (handles both loading and already-interactive DOM).
       */
      function triggerEntrance() {
        if (!splashEl) return;
        splashEl.classList.remove('is-hidden', 'is-entering');
        splashEl.style.transitionDuration = '500ms';

        // Double requestAnimationFrame guarantees browser layout flush before applying entrance transitions
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            splashEl.classList.add('is-entering');
          });
        });
      }

      /**
       * Public API: window.RushAnowSplash
       */
      const RushAnowSplash = {
        /**
         * Shows the splash screen and replays the entrance timeline.
         * @param {Object} [options]
         * @param {number|false} [options.autoHideMs=2500] - Auto-hide delay in ms, or false to wait for manual .hide()
         */
        show(options = {}) {
          const autoHideMs = options.autoHideMs !== undefined ? options.autoHideMs : 2500;
          clearTimeout(autoHideTimer);
          clearTimeout(hideTransitionTimer);

          triggerEntrance();

          if (typeof autoHideMs === 'number' && autoHideMs > 0) {
            autoHideTimer = setTimeout(() => {
              this.hide(500);
            }, autoHideMs);
          }
        },

        /**
         * Smoothly fades out and hides the splash overlay.
         * @param {number} [fadeOutMs=500] - Fade-out transition duration in milliseconds
         */
        hide(fadeOutMs = 500) {
          if (!splashEl) return;
          clearTimeout(autoHideTimer);
          splashEl.style.transitionDuration = `${fadeOutMs}ms`;
          splashEl.classList.add('is-hidden');

          hideTransitionTimer = setTimeout(() => {
            splashEl.classList.remove('is-entering');
          }, fadeOutMs);
        }
      };

      // Expose globally
      window.RushAnowSplash = RushAnowSplash;

      // Boot sequence: safely handle DOM readiness without relying solely on DOMContentLoaded
      function initSplash() {
        // Start splash with default 2.5s auto-hide fallback
        RushAnowSplash.show({ autoHideMs: 2500 });

        // Simulate an API/data readiness hook completing at 2.4s
        setTimeout(() => {
          RushAnowSplash.hide(500);
        }, 2400);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSplash, { once: true });
      } else {
        initSplash();
      }

      // Demo helper for the replay button
      window.replayDemoSplash = function () {
        RushAnowSplash.show({ autoHideMs: 2500 });
      };
    })();
  </script>
</body>
</html>
